name: Auto Update cPanel Repository

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Pull commit terbaru ke repository cPanel
        run: |
          curl --fail-with-body -g -sS \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
            "${{ secrets.CPANEL_URL }}/execute/VersionControl/update?repository_root=/home/${{ secrets.CPANEL_USER }}/public_html/project&branch=main"
