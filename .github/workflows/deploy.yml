name: Auto Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git Deployment
        run: |
          curl -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControl/deploy?repository_root=/home/${{ secrets.CPANEL_USER }}/public_html/project"