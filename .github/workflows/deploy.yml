name: Auto Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Pull Code Terbaru ke cPanel
        run: |
          curl -g -s -S -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControl/update?repository_root=/home/${{ secrets.CPANEL_USER }}/public_html/project&branch=main"

      - name: 2. Jalankan Deploy File
        run: |
          curl -g -s -S -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_TOKEN }}" \
          "${{ secrets.CPANEL_URL }}/execute/VersionControl/deploy?repository_root=/home/${{ secrets.CPANEL_USER }}/public_html/project"